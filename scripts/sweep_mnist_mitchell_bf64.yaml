# ============================================================================
# MNIST sweep: Mitchell's logarithmic approximate multiplier on dense_1
# (784->64) at ReuseFactor=784 (block_factor = 50,176 / 784 = 64) -- a third
# data point alongside RF=6272 (block_factor=8) and RF=3136 (block_factor=16)
# in scripts/MITCHELL_MULTILAYER_RESULTS.md.
#
# Note: RF=784 == n_in (784), so this lands in the `rf_leq_nin` codegen
# branch -- the SAME kernel family as `baseline_default_rf` (RF=56) and the
# original `mitchell_last` run, unlike the RF=6272/3136 data points which use
# `rf_gt_nin_rem0`. This is a bigger block_factor than previously tested
# (64 vs 16), so treat as a step up in synthesis-time risk; if it stalls the
# way the RF=56/block_factor=896 attempt did, kill it and fall back to a
# smaller block_factor.
#
# Two variants, both fresh synthesis runs, written under ./output/:
#   baseline_bf64       -- standard exact multiply, dense_1 RF=784, dense_2 default
#   mitchell_first_bf64 -- mitchell on dense_1 (RF=784) only, dense_2 left standard
#
# Usage:
#     python scripts/optimize_hls4ml.py --sweep scripts/sweep_mnist_mitchell_bf64.yaml
# ============================================================================

base_config: scripts/pipeline_mnist.yaml

sweep:
  - tag: baseline_bf64
    overrides:
      output_dir: ./output/hls_output_mnist_baseline_bf64
      pipeline:
        - name: set_reuse_factor
          target: by_name
          names: [dense_1]
          config: {reuse_factor: 784}
        - name: set_mult_strategy
          target: by_name
          names: [dense_1, dense_2]
          config: {mult_strategy: standard}

  - tag: mitchell_first_bf64
    overrides:
      output_dir: ./output/hls_output_mnist_mitchell_first_bf64
      pipeline:
        - name: set_reuse_factor
          target: by_name
          names: [dense_1]
          config: {reuse_factor: 784}
        - name: set_mult_strategy
          target: by_name
          names: [dense_1]
          config: {mult_strategy: mitchell}
